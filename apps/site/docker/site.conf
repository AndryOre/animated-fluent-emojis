map $remote_addr $masked_addr {
  default 0.0.0.0;
  "~^(?<octets>\d+\.\d+\.\d+)\.\d+$" "${octets}.0";
  "~^(?<hextets>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${hextets}::";
}

map $uri $not_found_page {
  default /404.html;
  "~^/(?<locale_segment>es|de|fr|it|ja|ko|pt-br|ru|zh-cn)/" /$locale_segment/404/index.html;
}

log_format masked '$masked_addr [$time_local] "$request" $status $body_bytes_sent';

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout masked;

  absolute_redirect off;
  error_page 404 $not_found_page;

  location ~ ^/(?:pt-BR|pt_BR|pt_br)(?<locale_rest>/.*)?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 /pt-br${locale_rest}$is_args$args;
  }

  location ~ ^/(?:zh-CN|zh_CN|zh_cn)(?<locale_rest>/.*)?$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 /zh-cn${locale_rest}$is_args$args;
  }

  location ~ ^/(?:es|de|fr|it|ja|ko|pt-br|ru|zh-cn)/404(?:/|/index\.html)?$ {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location ~ ^(?<index_dir>/(?:[A-Za-z0-9_-]+/)*)index\.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 $index_dir$is_args$args;
  }

  location ~ ^(?<slash_path>/[A-Za-z0-9_/-]*[A-Za-z0-9_-])$ {
    include /etc/nginx/snippets/security-headers.conf;
    return 301 $slash_path/$is_args$args;
  }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri.html =404;
  }
}
