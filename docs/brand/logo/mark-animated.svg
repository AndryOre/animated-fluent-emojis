<svg style="overflow:visible" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t"><title id="t">Animated Fluent Emojis</title><style>.open{animation:open 3s step-end infinite}.wink{opacity:0;animation:wink 3s step-end infinite}@keyframes open{0%,66%{opacity:1}67%,86%{opacity:0}87%,100%{opacity:1}}@keyframes wink{0%,66%{opacity:0}67%,86%{opacity:1}87%,100%{opacity:0}}.body{transform-box:fill-box;transform-origin:50% 100%;animation:hop 3s ease-in-out infinite}@keyframes hop{0%,60%,100%{transform:none}68%{transform:scale(1.07,.9)}76%{transform:translateY(-4px) scale(.97,1.04)}86%{transform:none}}.flap{transform-origin:50px 50px;animation:flap 3s ease-in-out infinite}@keyframes flap{0%,60%,100%{transform:none}70%{transform:scale(1.18)}80%{transform:scale(.92)}90%{transform:scale(1.05)}}@media (prefers-reduced-motion:reduce){.body,.open,.wink,.flap{animation:none}}</style><g class="body"><path d="M20 4 H44 Q60 4 60 20 V40 L40 60 H20 Q4 60 4 44 V20 Q4 4 20 4 Z" fill="#2EC4A0"/><circle cx="20.5" cy="24.3" r="4.0" fill="#0E1F1B"/><circle class="open" cx="39.5" cy="24.3" r="4.0" fill="#0E1F1B"/><path class="wink" d="M35.7 25.2 Q39.5 19.5 43.3 25.2" fill="none" stroke="#0E1F1B" stroke-width="4.2" stroke-linecap="round"/><path d="M19.6 35.6 Q30.0 46.1 40.5 35.6" fill="none" stroke="#0E1F1B" stroke-width="4.4" stroke-linecap="round"/><path class="flap" d="M60 40 L40 60 V48 Q40 40 48 40 Z" fill="#0B7A63"/></g></svg>
