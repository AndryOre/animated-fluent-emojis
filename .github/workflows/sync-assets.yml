name: Sync Assets

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild and redeploy even when nothing changed
        type: boolean
        default: false
      bypass_guards:
        description:
          Skip the Teams discovery and catalog removal guards (the file-count
          guard always runs)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Detect, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect new versions
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD: ${{ inputs.rebuild }}
          BYPASS_GUARDS: ${{ inputs.bypass_guards }}
        run: |
          args=()
          if [[ "${REBUILD}" == "true" ]]; then
            args+=(--rebuild)
          fi
          if [[ "${BYPASS_GUARDS}" == "true" ]]; then
            args+=(--bypass-guards)
          fi
          bun run assets:detect "${args[@]}"

      - name: Install ffmpeg
        if: steps.detect.outputs.changed == 'true'
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Read the pipeline version
        id: pipeline
        if: steps.detect.outputs.changed == 'true'
        run: |
          pipeline_version="$(grep --only-matching --perl-regexp 'PIPELINE_VERSION = \K\d+' scripts/assets/catalog.ts)"
          if [[ -z "${pipeline_version}" ]]; then
            echo "Could not read PIPELINE_VERSION from scripts/assets/catalog.ts" >&2
            exit 1
          fi
          echo "version=${pipeline_version}" >> "${GITHUB_OUTPUT}"

      - name: Restore the asset cache
        if: steps.detect.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/assets
          key:
            assets-${{ steps.pipeline.outputs.version }}-${{
            steps.detect.outputs.mit_sha }}-${{ steps.detect.outputs.teams_hash
            }}
          restore-keys: |
            assets-${{ steps.pipeline.outputs.version }}-${{ steps.detect.outputs.mit_sha }}-
            assets-${{ steps.pipeline.outputs.version }}-

      - name: Build assets
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_HASH: ${{ steps.detect.outputs.teams_hash }}
          BYPASS_GUARDS: ${{ inputs.bypass_guards }}
        run: |
          args=(--teams-hash "${TEAMS_HASH}")
          if [[ "${BYPASS_GUARDS}" == "true" ]]; then
            args+=(--bypass-guards)
          fi
          bun run assets:build "${args[@]}"

      - name: Deploy to Cloudflare Pages
        if: steps.detect.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          command:
            pages deploy dist-assets --project-name=animated-fluent-emojis
            --branch=main

      - name: Smoke test the legacy layout
        if: success()
        env:
          SITE_URL: https://animated-fluent-emojis.pages.dev
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
            "${SITE_URL}/manifest.slim.json" --output manifest.slim.json
          sprite_path="$(jq --raw-output '.categories[0] as $category | "\($category.title | @uri)/\($category.emoticons[0].id)"' manifest.slim.json)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors --head \
            "${SITE_URL}/sprites/${sprite_path}.png" > /dev/null
          rm manifest.slim.json

      - name: Smoke test the v1 layout
        if: success()
        env:
          SITE_URL: https://animated-fluent-emojis.pages.dev
        run: |
          expected_built_at=""
          if [[ -f dist-assets/v1/version.json ]]; then
            expected_built_at="$(jq --raw-output '.builtAt' dist-assets/v1/version.json)"
          fi
          published_built_at=""
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
              --header 'cache-control: no-cache' \
              "${SITE_URL}/v1/version.json" --output version.json
            published_built_at="$(jq --raw-output '.builtAt' version.json)"
            if [[ -z "${expected_built_at}" || "${published_built_at}" == "${expected_built_at}" ]]; then
              break
            fi
            echo "Attempt ${attempt}: published v1 builtAt ${published_built_at}, waiting for ${expected_built_at}" >&2
            sleep 10
          done
          if [[ -n "${expected_built_at}" && "${published_built_at}" != "${expected_built_at}" ]]; then
            echo "Published v1 builtAt ${published_built_at} does not match the build ${expected_built_at}" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
            "${SITE_URL}/v1/manifest.slim.json" --output manifest.slim.json
          sprite_path="$(jq --raw-output '.categories[0] as $category | $category.emoticons[0] as $emoticon | "\($category.title | @uri)/\($emoticon.id).\($emoticon.etag)"' manifest.slim.json)"
          hd_sprite_path="$(jq --raw-output '[.categories[] as $category | $category.emoticons[] | select(.hd) | {title: $category.title, id, etag}][0] | "\(.title | @uri)/\(.id).\(.etag)"' manifest.slim.json)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors --head \
            "${SITE_URL}/v1/sprites/${sprite_path}.png" > /dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors --head \
            "${SITE_URL}/v1/sprites/${hd_sprite_path}@2x.png" > /dev/null
          rm manifest.slim.json version.json

  emoji-lists:
    name: Refresh emoji lists
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sync
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Regenerate emoji lists
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors \
            "https://animated-fluent-emojis.pages.dev/manifest.json" \
            --output manifest.json
          bun run assets:lists --manifest manifest.json
          rm manifest.json

      - name: Open a pull request when the lists changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$(git status --porcelain -- docs src/utils/emoji-id.generated.ts)" ]]; then
            echo "Emoji lists are up to date."
            exit 0
          fi
          branch="docs/update-emoji-list"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          if [[ -n "$(git status --porcelain -- src/utils/emoji-id.generated.ts)" ]]; then
            entry="- Updated the \`EmojiId\` union from the published emoji catalog."
            unreleased="$(awk '/^## \[Unreleased\]/ { inside = 1; next } /^## \[/ { inside = 0 } inside { print }' CHANGELOG.md)"
            if ! grep --fixed-strings --quiet -- "${entry}" <<< "${unreleased}"; then
              awk -v entry="${entry}" '
                pending { print; print entry; pending = 0; done = 1; next }
                /^## \[Unreleased\]/ { print; in_unreleased = 1; next }
                in_unreleased && !done && (/^## \[/ || /^\[[^]]+\]: /) {
                  print "### Changed"; print ""; print entry; print ""; done = 1; in_unreleased = 0
                }
                in_unreleased && !done && /^### Changed/ { print; pending = 1; next }
                { print }
              ' CHANGELOG.md > CHANGELOG.md.tmp
              mv CHANGELOG.md.tmp CHANGELOG.md
            fi
          fi
          git add CHANGELOG.md docs src/utils/emoji-id.generated.ts
          git commit \
            --message "docs: 📝 update emoji list" \
            --message "- Regenerated the emoji lists from the published manifest"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "${branch}"
          open_pull_requests="$(gh pr list --head "${branch}" --state open --json number --jq length)"
          if [[ "${open_pull_requests}" == "0" ]]; then
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "docs: 📝 update emoji list" \
              --body "Regenerated by the Sync Assets workflow after a new emoji catalog was published."
          fi
          gh workflow run ci.yml --ref "${branch}"
          gh pr merge "${branch}" --auto --squash

  report-failure:
    name: Report a failed sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sync, emoji-lists]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          title="sync-assets failing"
          body="The Sync Assets workflow failed: ${RUN_URL}"
          number="$(gh issue list --repo "${REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${REPOSITORY}" --title "${title}" --body "${body}"
          fi

  resolve-failure:
    name: Close the failure issue after a successful sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [sync, emoji-lists]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      issues: write
    steps:
      - name: Close the open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          title="sync-assets failing"
          number="$(gh issue list --repo "${REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [[ -n "${number}" ]]; then
            gh issue close "${number}" --repo "${REPOSITORY}" --comment "Sync Assets succeeded again: ${RUN_URL}"
          fi
