name: Sync Assets

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and redeploy even when nothing changed
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Detect, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/assets
          key:
            assets-${{ hashFiles('scripts/assets/catalog.ts',
            'scripts/assets/sprites.ts') }}-${{ github.run_id }}
          restore-keys: |
            assets-${{ hashFiles('scripts/assets/catalog.ts', 'scripts/assets/sprites.ts') }}-

      - name: Detect new versions
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "${FORCE}" == "true" ]]; then
            args+=(--force)
          fi
          bun run assets:detect "${args[@]}"

      - name: Install ffmpeg
        if: steps.detect.outputs.changed == 'true'
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Build assets
        if: steps.detect.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_HASH: ${{ steps.detect.outputs.teams_hash }}
        run: bun run assets:build --teams-hash "${TEAMS_HASH}"

      - name: Deploy to Cloudflare Pages
        if: steps.detect.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command:
            pages deploy dist-assets --project-name=animated-fluent-emojis
            --branch=main

  emoji-lists:
    name: Refresh emoji lists
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate emoji lists
        run: |
          curl --fail --silent --show-error --location \
            "https://animated-fluent-emojis.pages.dev/manifest.json" \
            --output manifest.json
          bun run assets:lists --manifest manifest.json
          rm manifest.json

      - name: Open a pull request when the lists changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "$(git status --porcelain -- docs)" ]]; then
            echo "Emoji lists are up to date."
            exit 0
          fi
          branch="docs/update-emoji-list"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add docs
          git commit \
            --message "docs: 📝 update emoji list" \
            --message "- Regenerated the emoji lists from the published manifest"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "${branch}"
          open_pull_requests="$(gh pr list --head "${branch}" --state open --json number --jq length)"
          if [[ "${open_pull_requests}" == "0" ]]; then
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "docs: 📝 update emoji list" \
              --body "Regenerated by the Sync Assets workflow after a new emoji catalog was published."
          fi
          gh workflow run ci.yml --ref "${branch}"
          gh pr merge "${branch}" --auto --squash
