name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'packages/animated-fluent-emojis/**'
      - '.github/scripts/deploy-coolify.sh'
      - '.github/workflows/deploy-site.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build container and deploy via Coolify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute last-modified dates
        id: dates
        run:
          echo "map=$(bash apps/site/docker/last-modified.sh)" >>
          "$GITHUB_OUTPUT"

      - name: Build container
        env:
          LAST_MODIFIED_DATES: ${{ steps.dates.outputs.map }}
        run: |
          docker build -f apps/site/Dockerfile \
            --build-arg LAST_MODIFIED_DATES="${LAST_MODIFIED_DATES}" \
            -t animated-fluent-emojis-site:ci .

      - name: Trigger Coolify deploy and wait for the result
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          SITE_COOLIFY_APP_UUID: ${{ vars.SITE_COOLIFY_APP_UUID }}
          LAST_MODIFIED_DATES: ${{ steps.dates.outputs.map }}
        run: bash .github/scripts/deploy-coolify.sh
