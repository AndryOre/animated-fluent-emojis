name: Site Quality

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - 'docs/**'
      - 'packages/animated-fluent-emojis/**'
      - 'bun.lock'
      - '.github/workflows/site-quality.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site-quality:
    name: Smoke, accessibility and Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build and start the container
        run: |
          docker build -f apps/site/Dockerfile -t animated-fluent-emojis-site:ci .
          docker run -d --name site-ci -p 127.0.0.1:8080:80 animated-fluent-emojis-site:ci
          for _ in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          docker logs site-ci
          exit 1

      - name: Run the nginx smoke script
        run: bash apps/site/docker/smoke.sh

      - name: Audit the build output
        run: |
          rm -rf apps/site/dist
          docker cp site-ci:/usr/share/nginx/html apps/site/dist
          bun run --cwd apps/site test:dist

      - name: Install Playwright browser
        working-directory: apps/site
        run: bunx playwright install --with-deps chromium

      - name: Run the accessibility and interaction specs
        working-directory: apps/site
        run: bun run test:e2e

      - name: Run the visual regression snapshots
        run: bash apps/site/scripts/visual.sh

      - name: Enforce the Lighthouse budget
        working-directory: apps/site
        run: |
          CHROME_PATH="$(bun -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")"
          export CHROME_PATH
          bash scripts/lighthouse-budget.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: site-playwright-report
          path: |
            apps/site/playwright-report/
            apps/site/test-results/
          if-no-files-found: ignore
          retention-days: 7
