name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify, build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag matches the library package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(jq -r .version packages/animated-fluent-emojis/package.json)
          if [[ "${tag_version}" != "${pkg_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/animated-fluent-emojis/package.json version ${pkg_version}"
            exit 1
          fi

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Require green CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 1200))
          while true; do
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI passed")] | sort_by(.id) | last // empty')
            status=$(jq -r '.status // empty' <<< "${run_json}")
            conclusion=$(jq -r '.conclusion // empty' <<< "${run_json}")
            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                echo "CI passed concluded success for ${GITHUB_SHA}"
                exit 0
              fi
              echo "CI passed concluded ${conclusion} for ${GITHUB_SHA}. Re-run the failed CI job on main, then re-run this workflow."
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              if [[ -z "${status}" ]]; then
                echo "No CI passed check run found for ${GITHUB_SHA} after 20 minutes"
              else
                echo "CI passed is still ${status} for ${GITHUB_SHA} after 20 minutes"
              fi
              exit 1
            fi
            echo "CI passed is ${status:-missing}, checking again in 30s"
            sleep 30
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Check the live v1 layout matches this pipeline
        run: bun run assets:verify-live

      - name: Check
        run: bun run check

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Extract changelog section
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="${tag_version}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1 }
              next
            }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ -z "$(tr -d '[:space:]' < release-notes.md)" ]]; then
            echo "No CHANGELOG.md section found for version ${tag_version}"
            exit 1
          fi

      - name: Pack the tarball from the library workspace
        run: |
          mkdir release-artifact
          (cd packages/animated-fluent-emojis && bun pm pack --destination "${GITHUB_WORKSPACE}/release-artifact" --quiet)
          mv release-notes.md release-artifact/release-notes.md

      - name: Verify the tarball contents
        run: |
          tarball=$(ls ./release-artifact/*.tgz)
          listing=$(tar -tzf "${tarball}")
          for required in package/package.json package/README.md package/LICENSE; do
            if ! grep -qx "${required}" <<< "${listing}"; then
              echo "Tarball is missing ${required}"
              exit 1
            fi
          done
          if ! grep -q '^package/dist/' <<< "${listing}"; then
            echo "Tarball is missing dist"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact
          path: release-artifact
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm and create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifact
          path: release-artifact

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm for trusted publishing
        run: npm install -g npm@11.5.1 # zizmor: ignore[adhoc-packages]

      - name: Publish to npm
        run: |
          tarball=$(ls ./release-artifact/*.tgz)
          name=$(tar -xOf "${tarball}" package/package.json | jq -r .name)
          version=$(tar -xOf "${tarball}" package/package.json | jq -r .version)
          dist_tag=latest
          if [[ "${version}" == *-* ]]; then
            prerelease="${version#*-}"
            dist_tag="${prerelease%%.*}"
            if [[ "${dist_tag}" =~ ^[0-9]+$ ]]; then
              dist_tag=next
            fi
          fi
          if npm view "${name}@${version}" version > /dev/null 2>&1; then
            echo "${name}@${version} is already published, skipping npm publish"
          else
            npm publish "${tarball}" --tag "${dist_tag}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, skipping"
          else
            release_flags=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-artifact/release-notes.md \
              "${release_flags[@]}"
          fi
