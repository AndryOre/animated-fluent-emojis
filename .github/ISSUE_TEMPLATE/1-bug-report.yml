name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: 'fix: '
labels: ['Type: Bug', 'Status: Needs Info']

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label:
            I have searched the existing issues and confirmed this hasn't been
            reported.
          required: true

  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible so it can be reproduced and fixed quickly.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The installed version of `animated-fluent-emojis`.
      placeholder: 'e.g. 0.7.0'
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework and version
      description:
        The framework you render the emoji in, or the `<fluent-emoji>` element,
        and its version.
      placeholder: 'e.g. React 19.1.0, Vue 3.5, Svelte 5, Astro 5'
    validations:
      required: true

  - type: input
    id: bundler
    attributes:
      label: Bundler / framework
      description: Bundler or framework and its version.
      placeholder: 'e.g. Vite 8.0.0, Next.js 15, webpack 5'
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        Link to a minimal reproduction (StackBlitz, CodeSandbox, or a public
        repository).
      placeholder: https://
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Render '...'
        2. Pass the prop '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recording
      description:
        If applicable, add screenshots or a screen recording to help explain the
        problem.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and any other relevant details.
      placeholder: |
        - Browser: Chrome 130
        - OS: macOS 15

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description:
        Any other context about the problem (console logs, related issues,
        etc.).
