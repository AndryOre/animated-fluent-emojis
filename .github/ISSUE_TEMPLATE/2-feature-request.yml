name: Feature Request
description: Suggest a new feature or an improvement to an existing one
title: 'feat: '
labels: ['Type: Feature', 'Status: Needs Info']

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label:
            I have searched the existing issues and confirmed this hasn't been
            requested.
          required: true

  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please check the [roadmap](https://github.com/AndryOre/animated-fluent-emojis/blob/main/ROADMAP.md) first: some areas are explicitly out of scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why does it matter?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or anything else that helps explain the idea.
